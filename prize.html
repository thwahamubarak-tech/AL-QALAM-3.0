<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL QALAM 3.0 - Prize Desk</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .prize-card {
            background: var(--card-bg);
            border: 1px solid var(--accent);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="main-header">
        <div class="brand">
            <h2>AL QALAM 3.0 <span style="font-size: 12px; color:white;">[Prize Desk]</span></h2>
        </div>
        <a href="admin-login.html" style="color:var(--accent); text-decoration:none; font-size:13px;">Logout</a>
    </header>

    <main class="container">
        <h3 style="color:var(--accent);">Stage Prize Distribution Desk</h3>
        <div id="prizeList"></div>
    </main>

    <script>
        const SUPABASE_URL = 'https://weqvnlwiqppgxfvtzxhz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lj6bDDH7Os701RZEaXi8Ow_Awp-Gucs';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener("DOMContentLoaded", renderPrizeDesk);

        async function renderPrizeDesk() {
    const { data: marksList, error } = await db.from('marks')
        .select('*')
        .ilike('status', '%Sent to Prize%')
        .eq('prize_given', false);
    
    if (error) { console.error("Error fetching marks:", error); return; }

    const container = document.getElementById("prizeList");
    container.innerHTML = "";

    if (!marksList || marksList.length === 0) {
        container.innerHTML = "<p style='color:#888;'>No pending prize items available.</p>";
        return;
    }

    // 🔥 programs ടേബിളിൽ നിന്ന് 'type' എടുക്കുന്നു
    const { data: programsData } = await db.from('programs').select('name, type');
    const typeMap = {};
    (programsData || []).forEach(p => { typeMap[p.name] = p.type; });

    // 🔥 Group Program-കൾ ഫിൽട്ടർ ചെയ്യുന്നു
    let filteredMarks = marksList.filter(m => {
        return typeMap[m.program_name] !== 'Group';
    });

    if (!filteredMarks || filteredMarks.length === 0) {
        container.innerHTML = "<p style='color:#888;'>No eligible programs for prize.</p>";
        return;
    }

    // 🔥 participants ഡാറ്റ എടുക്കുന്നു
    const { data: participants } = await db.from('participants').select('*');
    const partMap = {};
    (participants || []).forEach(p => {
        partMap[String(p.chest_no).trim() + "_" + p.program_id] = { 
            name: p.name, 
            group: p.team_name || p.group_name || '-'
        };
    });

    // ✅ പ്രോഗ്രാം + category കൊണ്ട് ഗ്രൂപ്പ് ചെയ്യുന്നു
    const grouped = {};
    filteredMarks.forEach(m => {
        const cat = m.category || 'General';
        const key = m.program_name + "|" + cat;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(m);
    });

    Object.keys(grouped).forEach((fullKey, idx) => {
        const [progName, category] = fullKey.split('|');
        const entries = grouped[fullKey].slice().sort((a, b) => (b.mark || 0) - (a.mark || 0));

        // ✅ ഇത് മുതൽ പുതിയ ലോജിക്: റാങ്ക് 1, 2, 3 എന്നിവയിൽ ഉള്ള എല്ലാവരെയും എടുക്കും (ഒരേ മാർക്ക് = ഒരേ റാങ്ക്)
        let topEntries = [];
        let lastMark = null;
        let rank = 0;

        for (let i = 0; i < entries.length; i++) {
            if (entries[i].mark < 0) continue;
            if (lastMark === null || entries[i].mark !== lastMark) {
                rank++;
                lastMark = entries[i].mark;
            }
            if (rank <= 2) {
    topEntries.push({ ...entries[i], _rank: rank });
} else {
    break;
}
}  // ← ഈ } ആണ് missing ആയിരുന്നത്

const medals = ['🥇', '🥈'];
        let winnersHtml = '';

        topEntries.forEach((entry) => {
            let cleanChest = String(entry.chest_no || '').trim();
            const pInfo = partMap[cleanChest + "_" + entry.program_name] || { name: 'Chest ' + cleanChest, group: '-' };
            let studentName = pInfo.name;
            let groupName = pInfo.group;

            if (entry.judge_name && entry.judge_name.startsWith('Manual Entry:')) {
                let parts = entry.judge_name.replace('Manual Entry:', '').trim().split('(');
                studentName = parts[0].trim();
                if (parts[1]) groupName = parts[1].replace(')', '').trim();
            }

            let gradeVal = entry.grade || '-';
            let ptsVal = entry.mark || '0';
            let chestDisplay = cleanChest ? `(Chest: ${cleanChest})` : '';

            // ✅ റാങ്ക് അനുസരിച്ച് മെഡൽ കാണിക്കുന്നു
            let medal = '';
if (entry._rank === 1) medal = medals[0];
else if (entry._rank === 2) medal = medals[1];

            winnersHtml += `
                <div style="background:#222; border:1px solid #444; border-radius:6px; padding:6px; margin-bottom:4px;">
                    <div style="display:flex; align-items:center; gap:6px; color:#fff; font-size:13px;">
                        <span style="font-size:16px;">${medal}</span>
                        <span style="font-weight:bold;">${studentName}</span> ${chestDisplay}
                        <span style="color:#D4AF37;">[Group: ${groupName}]</span>
                        <span style="color:#ffeb3b;">(Grade: ${gradeVal} | Mark: ${ptsVal})</span>
                    </div>
                </div>
            `;
        });

        container.innerHTML += `
            <div class="prize-card" style="background:#1a1a1a; border:1px solid var(--accent); padding:15px; border-radius:8px; margin-bottom:12px;">
                <h3 style="color:var(--accent); margin:0 0 5px 0;">${progName} (${category})</h3>
                
                <div style="margin-bottom:10px;">${winnersHtml}</div>
                
                <label style="display:flex; align-items:center; gap:8px; margin-top:10px; cursor:pointer;">
                    <input type="checkbox" id="prize_chk_${idx}" style="width:18px; height:18px;">
                    <span style="color:var(--accent); font-weight:bold;">Trophy & Certificate Awarded</span>
                </label>

                <button onclick="sendPrizeToAdmin('${progName.replace(/'/g, "\\'")}', '${category.replace(/'/g, "\\'")}', ${idx})" style="margin-top:10px; background:#28a745; color:white; border:none; padding:8px 12px; border-radius:4px; font-weight:bold; cursor:pointer; width:100%;">
                    Give Prize & Update Status
                </button>
            </div>
        `;
    });
}

        async function sendPrizeToAdmin(programName, category, idx) {
            const checkbox = document.getElementById(`prize_chk_${idx}`);
            if (!checkbox || !checkbox.checked) {
                alert("Please check 'Trophy & Certificate Awarded' before submitting!");
                return;
            }

            const { data: records, error: fetchErr } = await db.from('marks')
                .select('id')
                .eq('program_name', programName)
                .eq('category', category); // ✅ ഇത് കൂടി ചേർക്കുക!

            if (fetchErr || !records) {
                alert('Error processing prize update.');
                return;
            }

            for (let rec of records) {
                const { data: existing } = await db.from('marks').select('status').eq('id', rec.id).single();
                let oldStatus = existing?.status || 'Pending';
                let newStatus = oldStatus.includes('Given') ? oldStatus : oldStatus + ' & Given';

                const { error } = await db.from('marks')
                    .update({ 
                        status: newStatus,
                        prize_given: true
                    })
                    .eq('id', rec.id);
                
                if (error) { 
                    alert('Error updating prize status: ' + error.message); 
                    return; 
                }
            }

            alert("Prize status successfully updated to Given!");
            renderPrizeDesk();
        }
    </script>
</body>
</html>
