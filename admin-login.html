<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL QALAM 3.0 - Management Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            max-width: 380px;
            margin: 40px auto;
            background: var(--card-bg, #1e1e1e);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--accent, #D4AF37);
            text-align: center;
        }
        .login-container select, .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary, #3a3a3a);
            color: var(--accent, #D4AF37);
            border: 1px solid var(--accent, #D4AF37);
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .login-btn:hover {
            background: #4a4a4a;
        }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="loading-overlay hidden">
        <img src="logo.png" alt="Logo" class="logo-spinner-img">
        <p>Authenticating...</p>
    </div>

    <div class="login-container">
        <img src="logo.png" alt="Logo" style="width: 70px; height: 70px; object-fit: contain;" onerror="this.style.display='none'">
        <h2 style="color: var(--accent, #D4AF37); margin: 10px 0 5px 0;">AL QALAM 3.0</h2>
        <p style="color: var(--text-muted, #aaa); font-size: 13px; margin-bottom: 20px;">Control Panel Access Portal</p>

        <form onsubmit="handleLogin(event)">
            <label style="display:block; text-align:left; font-size:12px; color:var(--text-muted, #aaa);">SELECT ROLE</label>
            <select id="userRole">
                <option value="admin">Master Admin</option>
                <option value="leader">Group Leader</option>
                <option value="judge">Judge Panel</option>
                <option value="code">Code Letter Officer</option>
                <option value="announcer">Announcer</option>
                <option value="prize">Prize Desk</option>
            </select>

            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>

            <button type="submit" class="login-btn">LOGIN</button>
        </form>
        <p style="margin-top: 15px;"><a href="index.html" style="color: var(--accent, #D4AF37); text-decoration: none; font-size: 13px;">← Back to Public Site</a></p>
    </div>

    <script src="js/db.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const role = document.getElementById("userRole").value;
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value.trim();

            const overlay = document.getElementById("loadingOverlay");
            if (overlay) overlay.classList.remove("hidden");

            setTimeout(() => {
                // Roles verification logic
                if (role === "admin" && u === "admin" && p === "8943278664") {
                    sessionStorage.setItem("alqalam_admin_logged_in", "true");
                    window.location.href = "admin.html";
        } else if (role === "leader" && (
            (u === "Andalusian Legends" && p === "45312678") ||
            (u === "Ottoman Titans" && p === "45312678") ||
            (u === "Baghdad Warriors" && p === "45312678")
        )) {
            localStorage.setItem("current_leader_group", u);
            window.location.href = "leader.html";
                } else if (role === "judge" && u === "judge" && p === "453126") {
                    window.location.href = "judge.html";
                } else if (role === "code" && u === "code" && p === "453126") {
                    window.location.href = "code-letter.html";
                } else if (role === "announcer" && u === "announcer" && p === "453126") {
                    window.location.href = "announcer.html";
                } else if (role === "prize" && u === "prize" && p === "453126") {
                    window.location.href = "prize.html";
                } else {
                    if (overlay) overlay.classList.add("hidden");
                    alert("Invalid Username or Password for selected role!");
                }
            }, 600);
        }
    </script>
</body>
</html>
